# Test profile: isolated in-memory H2 instance so integration tests never
# share state with a locally running dev backend (which also uses H2 by
# default - see src/main/resources/application.properties).
spring.datasource.url=jdbc:h2:mem:attendance_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-only-secret-not-for-production-use-32bytes
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=*
app.auth.max-attempts=100
app.auth.window-ms=900000
app.seed.demo-user=true
app.seed.academic-data=true

logging.level.root=WARN
