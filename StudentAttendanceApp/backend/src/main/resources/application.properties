# Local static-verification profile (H2). Cloud hosts set PORT + DATABASE_URL
# (postgres://...) and JWT_SECRET / GOOGLE_CLIENT_IDS as environment variables.
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:h2:mem:attendance;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-please-32bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:*}
app.auth.max-attempts=${AUTH_MAX_ATTEMPTS:8}
app.auth.window-ms=${AUTH_WINDOW_MS:900000}
app.attendance.low-threshold=${ATTENDANCE_THRESHOLD:75}
app.google.client-ids=${GOOGLE_CLIENT_IDS:}
app.seed.demo-user=${SEED_DEMO_USER:true}
app.seed.academic-data=${SEED_ACADEMIC:true}

logging.level.root=INFO
logging.level.com.studentattendance.backend=DEBUG
